# Publishes the project page (site/) to GitHub Pages, with screenshots
# from docs/images/ and the design mockups from assets/mockups/.
# Runs only when one of those changes on main, or by hand.
name: pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/images/**
      - assets/mockups/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, always the newest main.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site/images
          cp -r site/. _site/
          cp -r docs/images _site/images/docs
          cp -r assets/mockups _site/images/mockups
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
