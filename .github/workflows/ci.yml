# Builds 9/UX and runs every test layer (scripts/test.sh) on Linux x86_64.
#
# GitHub's runners have no KVM, so h9 runs 9front's amd64 binaries on its
# native backend (Syscall User Dispatch), and the root tree comes from the
# 9front release's amd64 ISO (scripts/h9.sh). Both, and the pinned Zig,
# are cached on scripts/pins.sh: a cold run fetches about 600 MB and
# builds h9 in a few minutes; a warm one starts testing in seconds.
name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Cache Zig, h9 and the 9front root
        uses: actions/cache@v4
        with:
          path: |
            .local/zig
            .local/hyper9
            !.local/hyper9/.zig-cache
          key: h9-${{ runner.os }}-${{ hashFiles('scripts/pins.sh', 'scripts/h9.sh', 'scripts/zig.sh') }}

      - name: Cache the harness build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            test/harness/.zig-cache
          key: harness-${{ runner.os }}-${{ hashFiles('scripts/pins.sh') }}-${{ hashFiles('test/harness/**') }}
          restore-keys: |
            harness-${{ runner.os }}-${{ hashFiles('scripts/pins.sh') }}-

      - name: Set up h9 and the root
        run: scripts/h9.sh --setup && scripts/h9.sh --check

      - name: Test
        run: scripts/test.sh

      - name: Upload screenshots from failed GUI tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gui-artifacts
          path: .local/test/artifacts
          if-no-files-found: ignore

  # libFuzzer on every component whose host Makefile has a fuzz target
  # (resfs's parser first). FUZZTIME seconds each.
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: libFuzzer's runtime
        run: sudo apt-get install -y --no-install-recommends libclang-rt-18-dev
      - name: Fuzz
        env:
          FUZZTIME: 300
        run: |
          status=0
          for mf in */Makefile; do
            grep -q '^fuzz:' "$mf" || continue
            d=$(dirname "$mf")
            echo "::group::fuzz $d"
            make -C "$d" fuzz FUZZTIME="$FUZZTIME" || status=1
            echo "::endgroup::"
          done
          exit $status
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: |
            */crash-*
            */leak-*
            */timeout-*
          if-no-files-found: ignore
